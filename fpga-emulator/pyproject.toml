[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-emulator"
version = "1.0.0"
description = "FPGA Hardware Emulator microservice"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "prometheus-client>=0.20",
]

[tool.setuptools.packages.find]
where = ["src"]
