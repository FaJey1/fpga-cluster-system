[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[project]
name = "fpga-master"
version = "0.0.1"
authors = [
  { name="Pavel Tsyngalev", email="ptsyngalev@gmail.com" }
]
description = "Package for delete in intersection mesh"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.111",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/FaJey1/fpga-system"
Issues = "https://github.com/FaJey1/fpga-system/issues"

[tool.setuptools.packages.find]
where = ["src"]
