[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-worker"
version = "1.0.0"
description = "FPGA Worker Node — Clean Architecture microservice"
requires-python = ">=3.10"
authors = [{ name = "Pavel Tsyngalev", email = "ptsyngalev@gmail.com" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "redis>=5.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
