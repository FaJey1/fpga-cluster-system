[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpgactl"
version = "1.0.0"
description = "CLI tool for FPGA cluster management (kubectl-style)"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
fpgactl = "fpgactl:cli"

[tool.setuptools]
py-modules = ["fpgactl"]
